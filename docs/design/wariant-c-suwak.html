<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Doubler — długość sesji, wariant C (suwak 20–60)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
      --bg-void:#05080d; --bg-panel:#0d141d; --bg-input:#0a1119;
      --border:#20303f; --border-soft:#182530;
      --accent:#ff8c1f; --accent-dim:#b3620f; --accent-glow:rgba(255,140,31,.38);
      --text-primary:#e7edf4; --text-secondary:#84939f; --text-dim:#485663;
      --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
      --font-sans:'Space Grotesk', -apple-system, 'Segoe UI', sans-serif;
      color-scheme:dark;
    }
    *{box-sizing:border-box;}
    html,body{margin:0; padding:0; min-height:100%;}
    body{
      color:var(--text-primary); font-family:var(--font-sans);
      background:
        radial-gradient(ellipse 1200px 800px at 50% -10%, rgba(255,140,31,.07), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 3px),
        var(--bg-void);
    }
    a{color:var(--accent); text-decoration:none;} a:hover{color:#ffa244;}
    .screen{padding:28px 16px 40px;}
    .panel{
      position:relative; background:var(--bg-panel); border:1px solid var(--border);
      border-radius:14px; padding:24px;
    }
    .panel::before,.panel::after{content:''; position:absolute; width:16px; height:16px; pointer-events:none;}
    .panel::before{top:-1px; left:-1px; border-top:2px solid var(--accent-dim); border-left:2px solid var(--accent-dim); border-top-left-radius:14px;}
    .panel::after{bottom:-1px; right:-1px; border-bottom:2px solid var(--accent-dim); border-right:2px solid var(--accent-dim); border-bottom-right-radius:14px;}
    h1.setup-title{font-family:var(--font-sans); font-size:20px; margin:0 0 18px; font-weight:600; color:var(--text-primary);}
    .field-label{
      display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.12em;
      text-transform:uppercase; color:var(--text-secondary); margin-bottom:8px;
    }
    .ta{
      width:100%; background:var(--bg-input); border:1px solid var(--border); border-radius:8px;
      color:var(--text-dim); font-family:var(--font-sans); font-size:15px; padding:12px 14px;
      min-height:66px; line-height:1.4;
    }
    .group-title{
      font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
      color:var(--text-secondary); margin:20px 0 10px;
    }
    .row{display:flex; gap:10px; flex-wrap:wrap;}
    .chip{
      flex:1; min-width:76px; text-align:center; padding:11px 10px; border-radius:8px;
      background:var(--bg-input); border:1px solid var(--border); color:var(--text-secondary);
      font-family:var(--font-mono); font-size:14px; font-weight:500; cursor:pointer; transition:all .15s;
    }
    .chip:hover{border-color:var(--accent-dim); color:var(--text-primary);}
    .chip.active{background:rgba(255,140,31,.12); border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
    .btn-primary{
      background:var(--accent); color:#1a0f00; width:100%; border:1px solid transparent; border-radius:9px;
      padding:13px 20px; font-family:var(--font-mono); font-weight:600; letter-spacing:.04em;
      text-transform:uppercase; font-size:14px; cursor:pointer; transition:background .15s;
    }
    .btn-primary:hover{background:#ffa244;}
    .cta-wrap{margin-top:22px;}
    .meta{
      font-family:var(--font-mono); font-size:11.5px; line-height:1.6; color:var(--text-secondary);
      text-align:center; margin-top:14px;
    }
    .meta b{color:var(--text-primary); font-weight:500;}

    .readout{display:flex; align-items:baseline; justify-content:center; gap:9px;}
    .readout .n{
      font-family:var(--font-mono); font-size:46px; font-weight:700; line-height:1; letter-spacing:-.02em;
      color:var(--accent); text-shadow:0 0 22px var(--accent-glow); font-variant-numeric:tabular-nums;
    }
    .readout .u{font-family:var(--font-mono); font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--text-dim);}
    .scale{position:relative; height:26px; margin-top:20px;}
    .track{
      position:absolute; left:13px; right:13px; top:9px; height:7px; border-radius:4px;
      background:var(--bg-input); border:1px solid var(--border); overflow:hidden;
    }
    .track > i{display:block; height:100%; background:var(--accent-dim);}
    .track .tick{position:absolute; top:0; bottom:0; width:1px; background:var(--border);}
    .track .tick.on{background:var(--bg-void); opacity:.9;}
    .rng{
      -webkit-appearance:none; appearance:none; position:absolute; inset:0; width:100%;
      height:26px; margin:0; background:transparent; cursor:pointer; display:block;
    }
    .rng:focus-visible{outline:2px solid var(--accent); outline-offset:4px; border-radius:6px;}
    .rng::-webkit-slider-runnable-track{height:26px; background:transparent; border:0;}
    .rng::-webkit-slider-thumb{
      -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
      background:var(--accent); border:2px solid var(--bg-panel); box-shadow:0 0 16px var(--accent-glow);
    }
    .rng::-moz-range-track{height:26px; background:transparent; border:0;}
    .rng::-moz-range-thumb{
      width:26px; height:26px; border-radius:50%; background:var(--accent);
      border:2px solid var(--bg-panel); box-shadow:0 0 16px var(--accent-glow);
    }
    .legend{position:relative; height:30px; margin-top:8px;}
    .legend .preset{
      position:absolute; top:0; background:transparent;
      border:1px solid var(--border); border-radius:7px; padding:5px 10px; cursor:pointer;
      font-family:var(--font-mono); font-size:11.5px; color:var(--text-secondary); transition:all .15s;
    }
    .legend .preset:hover{border-color:var(--accent-dim); color:var(--text-primary);}
    .legend .preset.active{border-color:var(--accent); color:var(--accent); background:rgba(255,140,31,.12);}

/* Prototyp stoi sam, więc dokłada to, co w aplikacji daje body/.app z globals.css. */
body{display:flex; justify-content:center;}
.screen{width:100%; max-width:640px;}
</style>
</head>
<body>
<div class="screen">
  <div class="panel">
    <h1 class="setup-title">Nowa sesja skupienia</h1>
    <label class="field-label">Nad czym pracujesz?</label>
    <div class="ta">np. Rozdział 3 scenariusza — research i pierwszy szkic</div>

    <div class="group-title">Długość sesji (min)</div>

    <div class="readout">
      <span class="n" id="len">45</span>
      <span class="u">minut</span>
    </div>

    <div class="scale">
      <div class="track"><i id="fill"></i></div>
      <input class="rng" id="rng" type="range" min="20" max="60" step="5" value="45"
             aria-label="Długość sesji w minutach">
    </div>

    <div class="legend" id="legend"></div>

    <div class="group-title">Częstotliwość check-inów (min)</div>
    <div class="row" id="freqs"></div>

    <div class="cta-wrap">
      <button type="button" class="btn-primary">▶ Start sesji</button>
    </div>
  </div>
</div>

<script>
/* Wariant C — suwak 20–60, krok 5. Presety: 20 / 30 / 45 / 60.
   Ten sam model co artboard WariantC.dc.html na canvasie designu. */
var MIN = 20, MAX = 60, STEP = 5;
var PRESETS = [20, 30, 45, 60];
var TICKS = [20, 25, 30, 35, 40, 45, 50, 55, 60];

var state = { len: 45, freq: 15 };

var elLen = document.getElementById('len');
var elFill = document.getElementById('fill');
var elRng = document.getElementById('rng');
var elLegend = document.getElementById('legend');
var elFreqs = document.getElementById('freqs');
var elTrack = elFill.parentNode;

function pct(v) { return ((v - MIN) / (MAX - MIN)) * 100; }

function clampLen(v) {
  return Math.min(MAX, Math.max(MIN, Math.round(v / STEP) * STEP));
}

function setLen(v) {
  state.len = clampLen(v);
  render();
}

// Podziałki rysujemy raz — zmienia się tylko ich klasa.
var tickEls = TICKS.map(function (v) {
  var el = document.createElement('span');
  el.className = 'tick';
  el.style.left = pct(v) + '%';
  elTrack.appendChild(el);
  return { v: v, el: el };
});

// Tor jest wcięty o 13px (połowa uchwytu), więc preset liczymy w tej samej
// geometrii co podziałki — inaczej środkowe wartości uciekają w lewo.
var presetEls = PRESETS.map(function (v) {
  var b = document.createElement('button');
  b.type = 'button';
  b.textContent = String(v);
  if (v === MIN) {
    b.style.left = '0';
  } else if (v === MAX) {
    b.style.right = '0';
  } else {
    b.style.left = 'calc((100% - 26px) * ' + pct(v) / 100 + ' + 13px)';
    b.style.transform = 'translateX(-50%)';
  }
  b.addEventListener('click', function () { setLen(v); });
  elLegend.appendChild(b);
  return { v: v, el: b };
});

var freqEls = [10, 15, 20].map(function (v) {
  var b = document.createElement('button');
  b.type = 'button';
  b.textContent = String(v);
  b.addEventListener('click', function () { state.freq = v; render(); });
  elFreqs.appendChild(b);
  return { v: v, el: b };
});

function render() {
  elLen.textContent = state.len;
  elFill.style.width = pct(state.len) + '%';
  if (Number(elRng.value) !== state.len) elRng.value = state.len;
  tickEls.forEach(function (t) {
    t.el.className = t.v < state.len ? 'tick on' : 'tick';
  });
  presetEls.forEach(function (p) {
    p.el.className = p.v === state.len ? 'preset active' : 'preset';
  });
  freqEls.forEach(function (f) {
    f.el.className = f.v === state.freq ? 'chip active' : 'chip';
  });
}

elRng.addEventListener('input', function (e) { setLen(Number(e.target.value)); });
render();
</script>
</body>
</html>
